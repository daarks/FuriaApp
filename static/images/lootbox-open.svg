<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    .box { 
      fill: #2c3e50; 
      stroke: #fff;
      stroke-width: 3;
    }
    .inner {
      fill: #34495e;
    }
    .logo {
      fill: #fff;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 24px;
    }
    .glow {
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      filter: drop-shadow(0 0 5px #fff);
    }
    .lines {
      fill: none;
      stroke: #fff;
      stroke-width: 1;
      opacity: 0.5;
    }
    .shine {
      fill: #fff;
      opacity: 0.2;
    }
  </style>
  
  <!-- Main box -->
  <rect class="box" x="40" y="40" width="120" height="120" rx="8" />
  <rect class="inner" x="45" y="45" width="110" height="110" rx="5" />
  
  <!-- FURIA logo on box -->
  <text class="logo" x="100" y="110" text-anchor="middle">FURIA</text>
  
  <!-- Box interior shine -->
  <polygon class="shine" points="50,50 150,50 130,150 70,150" />
  
  <!-- Decorative elements -->
  <line class="lines" x1="40" y1="80" x2="160" y2="80" />
  <line class="lines" x1="40" y1="120" x2="160" y2="120" />
  
  <!-- Open lid -->
  <g transform="rotate(-35, 35, 40)">
    <rect class="box" x="0" y="30" width="130" height="20" rx="5" />
    <rect class="glow" x="5" y="35" width="120" height="10" rx="3" />
  </g>
  
  <!-- Glow/light from open box -->
  <ellipse cx="100" cy="85" rx="50" ry="30" fill="#fff" opacity="0.1" />
</svg>