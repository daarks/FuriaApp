<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    .box { 
      fill: #2c3e50; 
      stroke: #fff;
      stroke-width: 3;
    }
    .logo {
      fill: #fff;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 24px;
    }
    .glow {
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      filter: drop-shadow(0 0 5px #fff);
    }
    .lines {
      fill: none;
      stroke: #fff;
      stroke-width: 1;
      opacity: 0.5;
    }
  </style>
  
  <!-- Main box -->
  <rect class="box" x="40" y="40" width="120" height="120" rx="8" />
  
  <!-- FURIA logo on box -->
  <text class="logo" x="100" y="110" text-anchor="middle">FURIA</text>
  
  <!-- Decorative elements -->
  <rect class="glow" x="45" y="45" width="110" height="110" rx="5" />
  <line class="lines" x1="40" y1="80" x2="160" y2="80" />
  <line class="lines" x1="40" y1="120" x2="160" y2="120" />
  
  <!-- Box lid -->
  <rect class="box" x="35" y="30" width="130" height="20" rx="5" />
  <rect class="glow" x="40" y="35" width="120" height="10" rx="3" />
</svg>